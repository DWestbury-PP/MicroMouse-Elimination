name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check js/sim.js && node --check js/app.js && node --check scripts/deploy.js
      - name: Engine tests
        run: node --test tests/
      - name: Balance report
        run: node tests/balance.js 150
